name: Build IPA
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 27.2 (iOS 27.2 SDK)
        run: |
          ls /Applications | grep -i xcode || true
          APP=$(ls -d /Applications/Xcode_27.2*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$APP" ]; then echo "Xcode 27.2 not found on this runner"; xcodebuild -showsdks; exit 1; fi
          sudo xcode-select -s "$APP"
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphoneos
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build unsigned app
        run: |
          xcodebuild -project FocusTimer.xcodeproj -scheme FocusTimer \
            -sdk iphoneos -configuration Release \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            -derivedDataPath build/DD build
      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R "build/DD/Build/Products/Release-iphoneos/FocusTimer.app" Payload/
          zip -qry FocusTimer.ipa Payload
          ls -la FocusTimer.ipa
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: FocusTimer-ipa
          path: FocusTimer.ipa
